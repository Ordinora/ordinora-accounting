services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ordinora
      POSTGRES_PASSWORD: ordinora_dev
      POSTGRES_DB: ordinora
    ports:
      - "5432:5432"
    volumes:
      - ordinora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ordinora"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  ordinora_pgdata:
